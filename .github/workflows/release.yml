name: Release

# Packages the theme into bender_<version>.zip. Push a tag like v3.3.0 to cut a
# release, or run manually (workflow_dispatch) to just build the artifact.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to package (e.g. 3.3.0)'
        required: true
        default: '3.3.0'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "value=$V" >> "$GITHUB_OUTPUT"

      # git archive honours .gitattributes export-ignore, so dev/build files
      # (sass, Gruntfile, package.json, tpl, ...) are left out of the zip. The
      # committed css/main.css is the shipped stylesheet — no Sass build needed.
      - name: Build theme zip
        run: |
          git archive --prefix=bender/ -o "bender_${{ steps.version.outputs.value }}.zip" HEAD
          echo "Contents:"; unzip -l "bender_${{ steps.version.outputs.value }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bender_${{ steps.version.outputs.value }}
          path: bender_${{ steps.version.outputs.value }}.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Bender ${{ steps.version.outputs.value }}
          files: bender_${{ steps.version.outputs.value }}.zip
          body: |
            Final Bender release — jQuery-free, PHP 8.0, updated for Shopclass 6.0.x
            (core user avatar, social share, native-dialog photo lightbox, vanilla
            uploader, equal-height grid).

            Only the default (blue) variant is published. The old red / black / purple
            colour variants were generated by a Ruby Compass + Grunt build that is now
            retired and no longer runs, so multi-colour packages are no longer produced.
            This is the last planned Bender release — Storefront is the maintained theme.
